name: release latest

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build
        run: mvn -B -ntp clean package

      - name: Delete previous release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest \
            --cleanup-tag \
            --yes \
            --repo ${{ github.repository }} || true

      - name: Create new release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build
          body: Build from commit `${{ github.sha }}` on `main`.
          files: target/frontiernav.jar
          make_latest: true