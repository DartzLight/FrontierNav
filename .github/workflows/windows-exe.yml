name: windows installer

on:
  push:
    branches: [ release_windows ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: true

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Build fat jar
        run: mvn -B -ntp clean package -DskipTests

      - name: Package with jpackage
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          jpackage ^
            --type exe ^
            --name FrontierNav ^
            --input target ^
            --main-jar frontiernav.jar ^
            --main-class cardinal.xenoblade.frontiernav.optimization.genetic.FrontierNavGeneticOptimizer ^
            --dest build ^
            --app-version 1.0.0 ^
            --vendor "DartzLight" ^
            --win-console ^
            --win-per-user-install ^
            --win-dir-chooser ^
            --win-menu ^
            --win-shortcut

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrontierNav-windows-installer
          path: build/*.exe

      - name: Attach installer to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: build/*.exe